<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pak Appliance Reviews</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-900">Pakistani AC Reviews (AI Cards)</h1>
        
        <div class="grid md:grid-cols-2 gap-6">
            {% for item in products %}
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
                <div class="flex justify-between items-start mb-4">
                    <h2 class="text-xl font-bold text-gray-800">{{ item.product_name }}</h2>
                    <span class="bg-blue-100 text-blue-800 font-semibold px-2.5 py-0.5 rounded">
                        ★ {{ item.score }}
                    </span>
                </div>
                
                <div class="mb-4">
                    <h3 class="font-semibold text-green-700">Pros:</h3>
                    <ul class="list-disc list-inside text-sm text-gray-600">
                        {% for pro in item.pros %}
                        <li>{{ pro }}</li>
                        {% endfor %}
                    </ul>
                </div>
                
                <div class="mb-4">
                    <h3 class="font-semibold text-red-700">Cons:</h3>
                    <ul class="list-disc list-inside text-sm text-gray-600">
                        {% for con in item.cons %}
                        <li>{{ con }}</li>
                        {% endfor %}
                    </ul>
                </div>
                
                <div class="mt-4 pt-3 border-t border-gray-100">
                    <p class="text-sm font-medium text-gray-700">
                        <span class="font-bold text-gray-900">Verdict:</span> {{ item.verdict }}
                    </p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
